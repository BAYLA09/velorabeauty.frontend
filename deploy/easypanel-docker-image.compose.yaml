# Easypanel → New Service → Compose → paste this file (or connect repo + path).
# No Git clone, no Dockerfile build on the server — pulls prebuilt GHCR image from GitHub Actions.
#
# After each merge on main: Actions → "Publish container" ✅ then Easypanel → Deploy (1–3 min).
# If "latest" does not update, pin the SHA tag from the workflow summary, e.g.:
#   image: ghcr.io/bayla09/velorabeauty.frontend:84c1112

services:
  velora-web:
    image: ghcr.io/bayla09/velorabeauty.frontend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_PATH: /app/data/velora.sqlite
      SITE_URL: https://www.velorabeauty.world
      # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, NEXT_PUBLIC_CARD_PAYMENT_ENABLED=true → Easypanel UI
    volumes:
      - velora-orders:/app/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  velora-orders:
