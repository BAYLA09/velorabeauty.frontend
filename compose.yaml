# Easypanel → New Service → Compose (or paste this file).
# Prebuilt image only — no Git clone, no build on the server.
services:
  velora-web:
    image: ghcr.io/bayla09/velorabeauty.frontend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
