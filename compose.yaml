# Easypanel → New Service → Compose (أو App → Docker Image بنفس الـ image).
# ⚠️ ما تستعملش Git build / Nixpacks — اسحب image جاهزة من GHCR فقط.
# بعد merge على main: GitHub Actions → Publish container ✅ ثم Easypanel → Deploy (1–3 د).
services:
  velora-web:
    image: ghcr.io/bayla09/velorabeauty.frontend:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_PATH: /app/data/velora.sqlite
      SITE_URL: https://www.velorabeauty.world
    volumes:
      - velora-orders:/app/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  velora-orders:
