# ⚠️ DO NOT use Nixpacks on Easypanel for this app (better-sqlite3 breaks).
# Use Docker Image: ghcr.io/bayla09/velorabeauty.frontend:latest
# or Compose: docker-compose.yml (pull only, no build).
[variables]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
NODE_OPTIONS = "--max-old-space-size=1536"
HOSTNAME = "0.0.0.0"
PORT = "3000"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
