# Deploy storefront on Easypanel after a new GHCR image is published.
#
# Easypanel (once): Environment → EASYPANEL_DEPLOY_WEBHOOK = Deployments → Webhook URL (Docker Image service)
# GitHub: no secret required — Actions uses OIDC → POST /api/deploy/trigger → Easypanel webhook
#
# Optional: GitHub Secret EASYPANEL_DEPLOY_WEBHOOK (direct) or DEPLOY_TRIGGER_SECRET (shared relay)

name: Deploy Frontend (Easypanel)

permissions:
  contents: read
  id-token: write

on:
  workflow_run:
    workflows: ["Publish container"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional 7-char commit SHA to verify on /api/health (default: main HEAD)"
        required: false
        default: ""

concurrency:
  group: deploy-frontend-easypanel
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve expected version prefix
        id: ver
        env:
          INPUT_SHA: ${{ github.event.inputs.expected_sha }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_SHA" ]; then
            echo "prefix=${INPUT_SHA:0:7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$RUN_SHA" ]; then
            echo "prefix=${RUN_SHA:0:7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -r .sha)"
          echo "prefix=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Detect optional GitHub secrets
        id: creds
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
          RELAY: ${{ secrets.DEPLOY_TRIGGER_SECRET }}
        run: |
          set -euo pipefail
          mode=oidc
          if [ -n "$WEBHOOK" ]; then mode=webhook; fi
          if [ -n "$RELAY" ]; then
            if [ "$mode" = webhook ]; then mode=both; else mode=relay; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Trigger Easypanel redeploy (direct webhook)
        id: direct
        if: >-
          steps.creds.outputs.mode == 'webhook' ||
          steps.creds.outputs.mode == 'both'
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            code=$(curl -sS -o /tmp/ep-deploy.txt -w "%{http_code}" -X POST "$WEBHOOK")
            echo "Webhook attempt $attempt → HTTP $code"
            cat /tmp/ep-deploy.txt || true
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Easypanel webhook failed. Webhook must target Docker Image service (not Git)."
          exit 1

      - name: Trigger Easypanel redeploy (shared-secret relay)
        id: relay_secret
        if: >-
          (steps.creds.outputs.mode == 'relay' || steps.creds.outputs.mode == 'both') &&
          (steps.direct.outcome != 'success')
        env:
          SECRET: ${{ secrets.DEPLOY_TRIGGER_SECRET }}
          TRIGGER_URL: https://www.velorabeauty.world/api/deploy/trigger
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            code=$(curl -sS -o /tmp/relay-deploy.txt -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $SECRET" \
              "$TRIGGER_URL")
            echo "Secret relay attempt $attempt → HTTP $code"
            cat /tmp/relay-deploy.txt || true
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          exit 1

      - name: Trigger Easypanel redeploy (OIDC relay — default)
        id: relay_oidc
        if: >-
          steps.direct.outcome != 'success' &&
          steps.relay_secret.outcome != 'success'
        uses: actions/github-script@v7
        env:
          TRIGGER_URL: https://www.velorabeauty.world/api/deploy/trigger
          OIDC_AUDIENCE: velorabeauty-easypanel-deploy
        with:
          script: |
            const triggerUrl = process.env.TRIGGER_URL;
            const audience = process.env.OIDC_AUDIENCE;
            for (let attempt = 1; attempt <= 4; attempt++) {
              const token = await core.getIDToken(audience);
              const res = await fetch(triggerUrl, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
              });
              const text = await res.text();
              core.info(`OIDC relay attempt ${attempt} → HTTP ${res.status}: ${text.slice(0, 400)}`);
              if (res.status >= 200 && res.status < 300) return;
              if (res.status === 503) {
                core.error(
                  'Easypanel env EASYPANEL_DEPLOY_WEBHOOK missing. Panel → Docker Image service → Environment → paste Deployments → Webhook URL → Save → Deploy once.',
                );
              }
              await new Promise((r) => setTimeout(r, attempt * 15000));
            }
            core.setFailed('Production deploy relay failed after 4 attempts.');

      - name: Wait for live /api/health version
        if: >-
          steps.direct.outcome == 'success' ||
          steps.relay_secret.outcome == 'success' ||
          steps.relay_oidc.outcome == 'success'
        env:
          EXPECT: ${{ steps.ver.outputs.prefix }}
          HEALTH_URL: https://www.velorabeauty.world/api/health
        run: |
          set -euo pipefail
          echo "Waiting for live version to start with: $EXPECT"
          for i in $(seq 1 40); do
            BODY="$(curl -sf "$HEALTH_URL" || true)"
            LIVE="$(echo "$BODY" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' | head -c 7)"
            echo "[$i] live=$LIVE"
            if [ -n "$LIVE" ] && [ "${LIVE:0:7}" = "$EXPECT" ]; then
              echo "Deploy verified on production."
              exit 0
            fi
            sleep 15
          done
          echo "::warning title=Production version not verified::Live site did not report $EXPECT within 10 minutes. Easypanel → Docker Image → Deploy. Deploy <2s = wrong Source (Git). See docs/EASYPANEL-DEPLOY-1-SECONDE-AR.md"
          exit 0
