name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=1536
          NEXT_PUBLIC_SNAP_PIXEL_ID: ${{ vars.NEXT_PUBLIC_SNAP_PIXEL_ID || '628f12d8-df4e-4272-889a-4806255011cd' }}

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx (classic driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Docker build (same as Easypanel)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: velorabeauty-frontend:ci
          driver: docker
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SNAP_PIXEL_ID=${{ vars.NEXT_PUBLIC_SNAP_PIXEL_ID || '628f12d8-df4e-4272-889a-4806255011cd' }}
            NEXT_PUBLIC_CARD_PAYMENT_ENABLED=${{ vars.NEXT_PUBLIC_CARD_PAYMENT_ENABLED || 'true' }}
