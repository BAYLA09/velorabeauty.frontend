# Builds the same Dockerfile as Easypanel and pushes to GHCR.
# Use when Easypanel Git clone fails ("Git key not found") — deploy from registry instead.
name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-container-${{ github.ref }}
  # Never cancel mid-push — Easypanel may pull a broken half-published tag.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (classic driver)
        uses: docker/setup-buildx-action@v3
        with:
          # Avoid pulling moby/buildkit from Docker Hub (often 504 on GHA).
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push (Easypanel Dockerfile, retries)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            tag_args="$tag_args -t $tag"
          done <<< "$TAGS"
          for attempt in 1 2 3 4; do
            echo "=== docker buildx push attempt $attempt ==="
            if docker buildx build --push $tag_args \
              --build-arg "GIT_SHA=${{ github.sha }}" \
              .; then
              exit 0
            fi
            sleep $((attempt * 45))
          done
          echo "::error::Docker build failed after 4 attempts (Docker Hub / network)."
          exit 1

      - name: Verify anonymous pull (same as Easypanel)
        run: |
          set -euo pipefail
          docker logout ghcr.io 2>/dev/null || true
          docker pull ghcr.io/bayla09/velorabeauty.frontend:latest
          docker inspect ghcr.io/bayla09/velorabeauty.frontend:latest --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' || true

      - name: Ensure GHCR package is public (anonymous Easypanel pull)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/users/${{ github.repository_owner }}/packages/container/velorabeauty.frontend" \
            -f visibility=public

      - name: Easypanel deploy instructions (summary)
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          {
            echo "## Easypanel — deploy بعد merge"
            echo ""
            echo "Image **public** على GHCR (ما محتاجش auth):"
            echo ""
            echo "\`\`\`text"
            echo "ghcr.io/bayla09/velorabeauty.frontend:latest"
            echo "ghcr.io/bayla09/velorabeauty.frontend:${SHORT}"
            echo "\`\`\`"
            echo ""
            echo "1. Easypanel → Source = **Docker Image** (ماشي GitHub/Git)."
            echo "2. Port **3000** · Volume **/app/data**."
            echo "3. **Deploy** — خاصو ياخذ **1–3 دقائق** (pull). إلا **1 ثانية** → Source مازال Git."
            echo "4. Easypanel → **Deploy** (1–3 min) — image ما كتوصلش وحده."
            echo "5. تحقق: \`curl -s https://www.velorabeauty.world/api/health\` → version فيها \`${SHORT}\`."
            echo "6. Env: \`deploy/easypanel.env.example\` · Guide: \`docs/EASYPANEL-DEPLOY-NOW-AR.md\`"
            echo "7. مشكل Deploy؟ \`./scripts/easypanel-diagnose.sh\`"
            echo ""
            echo "Compose جاهز: \`deploy/easypanel-docker-image.compose.yaml\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger Easypanel redeploy (optional)
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::notice::EASYPANEL_DEPLOY_WEBHOOK not set — Easypanel → Docker Image → Deploy manually"
            exit 0
          fi
          code=$(curl -sS -o /tmp/easypanel-webhook.txt -w "%{http_code}" -X POST "$WEBHOOK")
          echo "Easypanel webhook HTTP ${code}"
          cat /tmp/easypanel-webhook.txt || true
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::warning::Webhook failed (HTTP ${code}). Delete EASYPANEL_DEPLOY_WEBHOOK if it targets a Git service (1s deploy). Use Docker Image service webhook instead."
            exit 0
          fi
          echo "::notice::If deploy finished in ~1s on Easypanel, webhook points to wrong (Git) service — see docs/EASYPANEL-URGENT-AR.md"
