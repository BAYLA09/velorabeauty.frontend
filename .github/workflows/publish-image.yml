# Builds the same Dockerfile as Easypanel and pushes to GHCR.
# Use when Easypanel Git clone fails ("Git key not found") — deploy from registry instead.
name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-container-${{ github.ref }}
  # Never cancel mid-push — Easypanel may pull a broken half-published tag.
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (classic driver)
        uses: docker/setup-buildx-action@v3
        with:
          # Avoid pulling moby/buildkit from Docker Hub (often 504 on GHA).
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and push (Easypanel Dockerfile, retries)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            tag_args="$tag_args -t $tag"
          done <<< "$TAGS"
          for attempt in 1 2 3 4; do
            echo "=== docker buildx push attempt $attempt ==="
            if docker buildx build --push $tag_args \
              --build-arg "GIT_SHA=${{ github.sha }}" \
              --build-arg "NEXT_PUBLIC_SNAP_PIXEL_ID=${{ vars.NEXT_PUBLIC_SNAP_PIXEL_ID || '628f12d8-df4e-4272-889a-4806255011cd' }}" \
              --build-arg "NEXT_PUBLIC_CARD_PAYMENT_ENABLED=${{ vars.NEXT_PUBLIC_CARD_PAYMENT_ENABLED || 'true' }}" \
              .; then
              exit 0
            fi
            sleep $((attempt * 45))
          done
          echo "::error::Docker build failed after 4 attempts (Docker Hub / network)."
          exit 1

      - name: Ensure GHCR package is public (anonymous Easypanel pull)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/users/${{ github.repository_owner }}/packages/container/velorabeauty.frontend" \
            -f visibility=public

      - name: Easypanel deploy instructions (summary)
        run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          {
            echo "## Easypanel — deploy بعد merge"
            echo ""
            echo "Image **public** على GHCR (ما محتاجش auth):"
            echo ""
            echo "\`\`\`text"
            echo "ghcr.io/bayla09/velorabeauty.frontend:latest"
            echo "ghcr.io/bayla09/velorabeauty.frontend:${SHORT}"
            echo "\`\`\`"
            echo ""
            echo "1. Easypanel → Source = **Docker Image** (ماشي GitHub/Git)."
            echo "2. Port **3000** · Volume **/app/data**."
            echo "3. **Deploy** — خاصو ياخذ **1–3 دقائق** (pull). إلا **1 ثانية** → Source مازال Git."
            echo "4. Easypanel → **Deploy** (1–3 min) — image ما كتوصلش وحده."
            echo "5. تحقق: \`curl -s https://www.velorabeauty.world/api/health\` → version فيها \`${SHORT}\`."
            echo "6. Env: \`deploy/easypanel.env.example\` · Guide Darija: \`docs/DEPLOY-FRONTEND-DARIJA.md\`"
            echo "7. **Auto-deploy:** Easypanel Environment → \`EASYPANEL_DEPLOY_WEBHOOK\` = Deployments → Webhook URL (GitHub OIDC — no GitHub secret)."
            echo ""
            echo "Compose جاهز: \`deploy/easypanel-docker-image.compose.yaml\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auto deploy hint
        run: |
          echo "Next job: OIDC → /api/deploy/trigger (needs EASYPANEL_DEPLOY_WEBHOOK on Easypanel server)."
          echo "Setup: docs/DEPLOY-FRONTEND-DARIJA.md"

  deploy-easypanel:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Easypanel redeploy (OIDC)
        uses: actions/github-script@v7
        env:
          TRIGGER_URL: https://www.velorabeauty.world/api/deploy/trigger
          OIDC_AUDIENCE: velorabeauty-easypanel-deploy
        with:
          script: |
            const triggerUrl = process.env.TRIGGER_URL;
            const audience = process.env.OIDC_AUDIENCE;
            const short = context.sha.slice(0, 7);
            for (let attempt = 1; attempt <= 5; attempt++) {
              const token = await core.getIDToken(audience);
              const res = await fetch(triggerUrl, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
              });
              const text = await res.text();
              core.info(`OIDC deploy attempt ${attempt} → HTTP ${res.status}: ${text.slice(0, 500)}`);
              if (res.status >= 200 && res.status < 300) {
                core.notice(`Easypanel redeploy triggered for ${short}. Wait 1–3 min, then check /api/health.`);
                return;
              }
              if (res.status === 503) {
                core.error(
                  'Missing Easypanel env EASYPANEL_DEPLOY_WEBHOOK. Panel → Docker Image → Deployments → Webhook → copy URL → Environment → Save → Deploy once. Then re-run Publish container.',
                );
                core.setFailed('Auto-deploy blocked until EASYPANEL_DEPLOY_WEBHOOK is set on the server.');
                return;
              }
              await new Promise((r) => setTimeout(r, attempt * 12000));
            }
            core.setFailed('Easypanel deploy relay failed after 5 attempts.');
